services:
  public_gateway:
    image: caddy:2.11.4-alpine
    user: "1000:1000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DATAMARK_PUBLIC_API_ORIGIN: ${DATAMARK_PUBLIC_API_ORIGIN:?Public API HTTPS origin is required}
    ports:
      - target: 80
        published: "80"
        host_ip: ${DATAMARK_PUBLIC_BIND_IP:?Public gateway bind IP is required}
        protocol: tcp
      - target: 443
        published: "443"
        host_ip: ${DATAMARK_PUBLIC_BIND_IP:?Public gateway bind IP is required}
        protocol: tcp
    volumes:
      - type: bind
        source: ./Caddyfile.public
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${DATAMARK_HOME:?Deployment directory is required}/public-caddy-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATAMARK_HOME:?Deployment directory is required}/public-caddy-config
        target: /config
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
    networks:
      - private
      - ingress
