services:
  public_gateway:
    image: ghcr.io/caddy-dns/cloudflare@sha256:f46799052f9dfcf7e634326d279d47a58c1ea598f8330c0b77921971f14aeaf0
    user: "1000:1000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DATAMARK_PUBLIC_API_ORIGIN: ${DATAMARK_PUBLIC_API_ORIGIN:?Public API HTTPS origin is required}
    ports:
      - target: 10443
        published: "10443"
        host_ip: ${DATAMARK_PUBLIC_BIND_IP:?Public gateway bind IP is required}
        protocol: tcp
    secrets:
      - cloudflare_api_token
    volumes:
      - type: bind
        source: ./Caddyfile.public
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${DATAMARK_HOME:?Deployment directory is required}/public-caddy-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${DATAMARK_HOME:?Deployment directory is required}/public-caddy-config
        target: /config
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
    networks:
      - private
      - ingress

secrets:
  cloudflare_api_token:
    file: ${DATAMARK_HOME:?Deployment directory is required}/secrets/cloudflare-api-token
